packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

# Security overrides for transitive CVEs. Moved here from package.json
# `pnpm.overrides` (#1454): pnpm v10 no longer reads the `pnpm` field
# ("The 'pnpm' field in package.json is no longer read by pnpm... keys
# ignored: pnpm.overrides"), so the pins had gone inactive for any new
# resolution. Revisit periodically with `pnpm why <pkg>` to confirm each
# override is still hit by the dep graph (#963).
overrides:
  # Transitive via @modelcontextprotocol/node. Floor at the lowest
  # non-vulnerable version for the advisory family, currently the
  # 2026-10 serveStatic double-decode advisory affecting < 4.13.11
  # (previously < 4.13.5, #1587).
  hono: '>=4.13.11'
  # Moved from the dead package.json `pnpm.overrides` block (ignored by
  # pnpm v10, see note above).
  # Dev-only, transitive via minimatch. ReDoS advisories patched in 5.0.12.
  brace-expansion: '>=5.0.12'
  '@babel/core': '>=7.29.6'
  # Transitive via @modelcontextprotocol/node. Advisories affect < 1.19.13.
  '@hono/node-server': '>=2.1.3'
  # Dev-only, transitive via eslint -> flat-cache. ReDoS advisory.
  flatted: '>=3.4.2'
  # Dev-only, transitive via typescript-eslint -> tinyglobby. ReDoS advisory.
  picomatch: '>=4.0.4'
  # Dev-only, transitive via vitest -> vite. Code-execution advisory.
  yaml: '>=2.8.3'
  # Dev-only, transitive via @oss-autopilot/dashboard -> jsdom -> undici.
  # jsdom 30 pulls undici 8.x; the 2026-10 advisory family (GHSA-r53p-7pc4-xj5r
  # and others) affects undici 8.x <8.10.2. Earlier 7.x advisories are
  # patched in 7.28.0.
  undici: '>=8.10.2'
  # Dev-only, transitive via vite -> postcss. Advisory: custom generators
  # can loop indefinitely when size is zero; patched in 3.3.18.
  nanoid: '>=3.3.18'
  # Dev-only, transitive via @oss-autopilot/core -> typedoc -> markdown-it.
  # Quadratic-complexity ReDoS advisory GHSA-22p9-wv53-3rq4 in linkify-it
  # <=5.0.0; patched in 5.0.1.
  linkify-it: '>=5.0.1'
  # Dev-only, transitive via @oss-autopilot/core -> typedoc. Advisory
  # affects markdown-it <14.3.1. Kept on the 14.x line typedoc expects.
  markdown-it: '^14.3.1'
  # Dev-only, transitive via eslint-plugin-unicorn -> @eslint/css-tree.
  # Advisory affects source-map-js <1.2.2.
  source-map-js: '>=1.2.2'
