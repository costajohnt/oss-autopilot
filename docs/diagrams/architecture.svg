<svg viewBox="0 0 820 538" role="img" aria-label="OSS Autopilot — Three interfaces over one deterministic core (architecture diagram)" width="820" height="538" xmlns="http://www.w3.org/2000/svg"><style>@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
