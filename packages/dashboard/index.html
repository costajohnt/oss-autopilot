<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSS Autopilot Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('oss-autopilot-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 40rem;
          margin: 4rem auto;
          padding: 1.5rem;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          line-height: 1.5;
          color: #e0e0e0;
          background: #1a1a1a;
          border: 1px solid #333;
          border-radius: 8px;
        "
      >
        <h1 style="margin-top: 0">JavaScript required</h1>
        <p>
          The OSS Autopilot dashboard is a single-page app that renders entirely on the client. Please enable JavaScript
          for this origin to use the interactive UI.
        </p>
        <p>
          For a raw JSON view of the same data, fetch
          <code style="background: #252525; padding: 0.125rem 0.375rem; border-radius: 3px">/api/data</code> directly.
        </p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
