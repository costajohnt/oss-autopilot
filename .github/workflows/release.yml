name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "undefined" ]; then
            echo "::error::Failed to read version from package.json (got: '$CURRENT')"
            exit 1
          fi
          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]'; then
            echo "::error::Version '$CURRENT' does not look like semver"
            exit 1
          fi

          TAG="v${CURRENT}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Version ${CURRENT} already released — skipping."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "::warning::Tag ${TAG} exists but no release found. Will create release."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "New version detected: ${CURRENT}"
          fi

      - name: Extract changelog section
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repository root"
            exit 1
          fi

          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            echo "::warning::No CHANGELOG.md entry found for version ${VERSION}. Using generic release body."
            BODY="Release v${VERSION} (no changelog entry found)"
          fi

          echo "$BODY" > /tmp/release-body.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "v${RELEASE_VERSION}" \
            --notes-file /tmp/release-body.md \
            --target main
