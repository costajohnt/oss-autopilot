# Note: release-please.yml now handles automated version bumps and changelog PRs.
# This workflow creates GitHub releases from manual version bumps (backward compat).
# If a release-please PR was merged, its release is created first and this workflow
# skips via the "exists == true" guard in the version check step.
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NODE_ERR=$(mktemp)
          CURRENT=$(node -e "console.log(require('./packages/core/package.json').version)" 2>"$NODE_ERR") || true

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "undefined" ]; then
            echo "::error::Failed to read version from packages/core/package.json (got: '$CURRENT'). $(cat "$NODE_ERR")"
            exit 1
          fi
          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$CURRENT' does not look like semver"
            exit 1
          fi

          TAG="v${CURRENT}"

          TAG_EXISTS=false
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          if [ "$TAG_EXISTS" = true ]; then
            RELEASE_ERR=$(gh release view "$TAG" 2>&1) && RELEASE_EXISTS=true || RELEASE_EXISTS=false
            if [ "$RELEASE_EXISTS" = true ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Version ${CURRENT} already released — skipping."
            elif echo "$RELEASE_ERR" | grep -q "release not found"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Tag ${TAG} exists but no release found. Will create release."
            else
              echo "::error::Failed to check release status for ${TAG}: ${RELEASE_ERR}"
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "New version detected: ${CURRENT}"
          fi

      - name: Extract changelog section
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f packages/core/CHANGELOG.md ]; then
            echo "::error::packages/core/CHANGELOG.md not found"
            exit 1
          fi

          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' packages/core/CHANGELOG.md)

          if [ -z "$BODY" ]; then
            echo "::warning::No CHANGELOG.md entry found for version ${VERSION}. Using generic release body."
            BODY="Release v${VERSION} (no changelog entry found)"
          fi

          printf '%s\n' "$BODY" > /tmp/release-body.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          ARGS=(
            "$RELEASE_TAG"
            --title "v${RELEASE_VERSION}"
            --notes-file /tmp/release-body.md
          )
          if [ "$TAG_EXISTS" != "true" ]; then
            ARGS+=(--target main)
          fi
          gh release create "${ARGS[@]}"
