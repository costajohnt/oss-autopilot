name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run bundle

      - name: Verify bundle exists
        run: |
          if [ ! -f dist/cli.bundle.cjs ]; then
            echo "ERROR: dist/cli.bundle.cjs was not produced by the bundle step"
            exit 1
          fi
          echo "Bundle created successfully: $(wc -c < dist/cli.bundle.cjs) bytes"

  update-badge:
    name: Update test badge
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and update badge
        run: |
          RESULT=$(npx vitest run --reporter=json 2>/dev/null || true)
          PASSED=$(echo "$RESULT" | node -e "
            let buf = '';
            process.stdin.on('data', d => buf += d);
            process.stdin.on('end', () => {
              try {
                const json = JSON.parse(buf);
                console.log(json.numPassedTests || 0);
              } catch { console.log(0); }
            });
          ")
          if [ "$PASSED" -gt 0 ]; then
            echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passing\",\"color\":\"success\"}" > .github/badges/tests.json
            echo "Badge updated: ${PASSED} passing"
          else
            echo "No passing tests detected, skipping badge update"
          fi

      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          git diff --staged --quiet || git commit -m "chore: update test badge [skip ci]"
          git push
