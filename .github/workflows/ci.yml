name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          - os: macos-latest
            node-version: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build core types
        run: pnpm --filter @oss-autopilot/core run build

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Coverage report
        if: matrix.node-version == 22
        run: pnpm run test:coverage

      - name: Build bundle
        run: pnpm run bundle

      - name: Verify bundles exist
        run: |
          for bundle in packages/core/dist/cli.bundle.cjs packages/mcp-server/dist/mcp-server.bundle.cjs; do
            if [ ! -f "$bundle" ]; then
              echo "ERROR: $bundle was not produced by the bundle step"
              exit 1
            fi
            size=$(wc -c < "$bundle")
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $bundle is suspiciously small ($size bytes)"
              exit 1
            fi
            if ! head -1 "$bundle" | grep -q '^#!/usr/bin/env node'; then
              echo "ERROR: $bundle is missing required shebang"
              exit 1
            fi
            echo "Bundle verified: $bundle ($size bytes)"
          done

  # Maintains a shields.io endpoint badge with the current passing test count.
  # Re-runs tests after CI passes on main, writes the count to .github/badges/tests.json
  # on a separate 'badges' branch (main is protected and blocks direct pushes).
  # The README references this file via a shields.io /endpoint badge URL.
  update-badge:
    name: Update test badge
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and update badge
        run: |
          pnpm --filter @oss-autopilot/core exec vitest run --reporter=json --outputFile=test-results.json || true
          if [ ! -f packages/core/test-results.json ]; then
            echo "::warning::vitest did not produce test-results.json. Badge not updated."
            exit 0
          fi
          PASSED=$(node -p "try { require('./packages/core/test-results.json').numPassedTests || 0 } catch { 0 }")
          if [ "$PASSED" -gt 0 ]; then
            mkdir -p .github/badges
            echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passing\",\"color\":\"success\"}" > .github/badges/tests.json
            echo "Badge updated: ${PASSED} passing"
          else
            echo "::warning::vitest ran but 0 tests passed. Badge not updated."
          fi
          rm -f packages/core/test-results.json

      - name: Push badge to badges branch
        run: |
          if [ ! -f .github/badges/tests.json ]; then
            echo "No badge file to push"
            exit 0
          fi
          cp .github/badges/tests.json /tmp/badge.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Disable git hooks before checkout — the badges branch has no package.json,
          # so pnpm post-checkout hooks fail with ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND.
          rm -rf .git/hooks
          # Fetch existing badges branch, or create orphan on first run
          if git fetch origin badges:badges 2>/dev/null; then
            git checkout -f badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p .github/badges
          cp /tmp/badge.json .github/badges/tests.json
          git add .github/badges/tests.json
          # Only commit and push if badge content changed
          if git diff --staged --quiet; then
            echo "Badge unchanged, skipping push"
          else
            git commit -m "chore: update test badge [skip ci]"
            git push origin badges --force
          fi
