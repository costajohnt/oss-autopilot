name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bundle size thresholds (bytes). Update via PR when increases are justified.
  #
  # Threshold-bump policy:
  #   - **Justified bump (just edit the number):** the increase comes from a
  #     deliberate addition — a new command, a new schema, a new dependency
  #     that was needed. Append a parenthetical citing the issue/PR that
  #     justified the bump.
  #   - **Investigate before bumping:** the increase has no obvious source
  #     in the diff. Likely candidates: an accidental large dep import, a
  #     transitive bundling regression, a schema duplication. Look at
  #     `pnpm run bundle` output and the diff before raising the cap.
  #   - **Don't bump for a flaky measurement:** esbuild output is
  #     deterministic. If the threshold trips on a no-op rebuild, it's a
  #     real increase somewhere upstream — not noise.
  BUNDLE_MAX_CORE: 820000 # ~801 KB (increased for compliance-score command + linked-issue verification, #1245/#1246)
  BUNDLE_MAX_MCP: 2000000 # ~1953 KB
  STARTUP_WARN_MS: 500 # Warn if CLI startup exceeds 500ms

jobs:
  # Fast-feedback lint job. Gates the matrix below so a lint or formatting
  # regression fails CI in ~2 min instead of waiting for the full 3-way matrix
  # (Node 22/24 ubuntu + Node 22 macos) to each independently catch the same
  # error. Runs on a single host because lint output is environment-independent.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  ci:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    # pull-requests: write is needed for the "Check build metrics" step to post PR
    # comments. GitHub Actions does not support per-matrix-entry permissions, so all
    # matrix jobs receive this grant even though only Node 22/ubuntu uses it.
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        include:
          - os: macos-latest
            node-version: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      # Lint + format:check are handled by the dedicated `lint` job above
      # (matrix `needs: [lint]`). Skipped here to avoid 3x duplicate work.

      - name: Build core types
        run: pnpm --filter @oss-autopilot/core run build

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Test session-start hook helpers
        run: bash hooks/safe-refresh-marketplace.test.sh

      - name: Test build-cli-if-stale helper (#1292)
        run: bash scripts/build-cli-if-stale.test.sh

      - name: Test guard-public-posts hook
        run: bash hooks/guard-public-posts.test.sh

      - name: Guard against phantom config field regressions
        # These keys were deleted from the v3 state schema (see
        # state-persistence.ts migrateV2ToV3). They must NOT reappear in
        # plugin-facing docs or scripts — setup --set silently no-ops on
        # deleted keys, so references become lies.
        run: |
          if grep -rn --include='*.md' --include='*.cjs' --include='*.sh' \
             -E '(scoreThreshold|showHealthCheck)' commands/ .claude-plugin/; then
            echo "::error::Found references to deleted v3 config keys. See issue #1033."
            exit 1
          fi

      - name: Guard MCP metadata consistency
        # Catches drift between packages/mcp-server/package.json, server.json,
        # the registered tool count in tools.ts, and what the README claims.
        # See issue #1034.
        run: |
          PKG_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          SERVER_JSON_VERSION=$(node -p "require('./packages/mcp-server/server.json').version")
          PACKAGE_ENTRY_VERSION=$(node -p "require('./packages/mcp-server/server.json').packages[0].version")

          if [ "$PKG_VERSION" != "$SERVER_JSON_VERSION" ] || [ "$PKG_VERSION" != "$PACKAGE_ENTRY_VERSION" ]; then
            echo "::error::MCP server.json version ($SERVER_JSON_VERSION / $PACKAGE_ENTRY_VERSION) does not match package.json ($PKG_VERSION). Bump server.json to match."
            exit 1
          fi

          REGISTERED=$(grep -c 'server.registerTool(' packages/mcp-server/src/tools.ts)
          README_COUNT=$(grep -oE '\*\*Tools\*\* \| [0-9]+' packages/mcp-server/README.md | grep -oE '[0-9]+' | head -1)
          README_ROWS=$(awk '/^## Tools Reference/,/^## Resources Reference/' packages/mcp-server/README.md | grep -c '^| `')

          if [ "$REGISTERED" != "$README_COUNT" ] || [ "$REGISTERED" != "$README_ROWS" ]; then
            echo "::error::MCP tool count drift: tools.ts registers $REGISTERED, README summary says $README_COUNT, README table rows $README_ROWS. Align all three."
            exit 1
          fi

      - name: Guard against mcp__* wildcard in agent tools
        # Agents must declare specific MCP tools, never the wildcard. See
        # agents/README.md for rationale. mcp__* would grant access to every
        # MCP server on the user's machine (including cross-channel posting),
        # bypassing the draft-review-post gate the global CLAUDE.md enforces.
        # Matches only `tools:` frontmatter lines so prose in README.md that
        # discusses the pattern (for documentation) does not false-positive.
        run: |
          if grep -Hn '^tools:.*mcp__\*' agents/*.md; then
            echo "::error::Agent frontmatter contains mcp__* wildcard. Use a narrow allowlist. See agents/README.md and issue #1029."
            exit 1
          fi

      - name: "Guard against `model: inherit` in agent frontmatter"
        # Every agent must declare an explicit tier (haiku/sonnet/opus) so
        # cheap bounded tasks and heavy reasoning tasks don't silently inherit
        # whatever model the parent session uses. See agents/README.md for the
        # workload→tier rationale and issue #1040 for the original audit.
        # Matches only top-of-file frontmatter `model:` keys on `*.md` files
        # inside agents/ so prose discussing the pattern does not
        # false-positive.
        run: |
          if grep -Hn '^model:[[:space:]]*inherit' agents/*.md; then
            echo "::error::Agent frontmatter contains 'model: inherit'. Pick an explicit tier — see agents/README.md and issue #1040."
            exit 1
          fi

      - name: Coverage report
        if: matrix.node-version == 22
        run: pnpm run test:coverage

      - name: Validate API docs
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        run: pnpm run docs:check

      - name: Build bundle
        run: pnpm run bundle

      - name: Verify bundles exist
        run: |
          for bundle in packages/core/dist/cli.bundle.cjs packages/mcp-server/dist/mcp-server.bundle.cjs; do
            if [ ! -f "$bundle" ]; then
              echo "ERROR: $bundle was not produced by the bundle step"
              exit 1
            fi
            size=$(wc -c < "$bundle")
            if [ "$size" -lt 1000 ]; then
              echo "ERROR: $bundle is suspiciously small ($size bytes)"
              exit 1
            fi
            if ! head -1 "$bundle" | grep -q '^#!/usr/bin/env node'; then
              echo "ERROR: $bundle is missing required shebang"
              exit 1
            fi
            echo "Bundle verified: $bundle ($size bytes)"
          done

      # Runs on all matrix entries (no `if` guard) — startup time across Node
      # versions and OS is visible in each job's step output for comparison.
      - name: Benchmark CLI startup
        id: benchmark
        run: |
          BENCH_STDERR=$(mktemp)
          STARTUP_MS=$(node .github/scripts/benchmark-startup.cjs 2>"$BENCH_STDERR") || true
          if ! [[ "$STARTUP_MS" =~ ^[0-9]+$ ]]; then
            echo "::error::Benchmark produced non-numeric startup time: '$STARTUP_MS'"
            cat "$BENCH_STDERR"
            rm -f "$BENCH_STDERR"
            exit 1
          fi
          rm -f "$BENCH_STDERR"
          echo "startup_ms=$STARTUP_MS" >> "$GITHUB_OUTPUT"
          echo "CLI startup (--help): ${STARTUP_MS}ms (median of 5 runs)"

      - name: Check build metrics
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTUP_MS: ${{ steps.benchmark.outputs.startup_ms }}
        run: |
          # Validate startup benchmark output is numeric (defense-in-depth)
          if [ -n "$STARTUP_MS" ] && ! [[ "$STARTUP_MS" =~ ^[0-9]+$ ]]; then
            echo "::warning::Startup benchmark output is non-numeric: '$STARTUP_MS'"
            STARTUP_MS=""
          fi

          CORE_SIZE=$(wc -c < packages/core/dist/cli.bundle.cjs | tr -d ' ')
          MCP_SIZE=$(wc -c < packages/mcp-server/dist/mcp-server.bundle.cjs | tr -d ' ')

          # Pre-compute KB values (used in summary, comment, and error messages)
          core_kb=$(echo "scale=1; $CORE_SIZE / 1024" | bc)
          mcp_kb=$(echo "scale=1; $MCP_SIZE / 1024" | bc)
          core_max_kb=$(echo "scale=1; $BUNDLE_MAX_CORE / 1024" | bc)
          mcp_max_kb=$(echo "scale=1; $BUNDLE_MAX_MCP / 1024" | bc)

          # Helper: format a byte delta as " +X.Y KB |", " -X.Y KB |", or " no change |"
          format_delta() {
            local delta=$1
            if [ "$delta" -gt 0 ]; then
              echo " +$(echo "scale=1; $delta / 1024" | bc) KB |"
            elif [ "$delta" -lt 0 ]; then
              echo " $(echo "scale=1; $delta / 1024" | bc) KB |"
            else
              echo " no change |"
            fi
          }

          # Helper: format a millisecond delta as " +Xms |", " -Xms |", or " no change |"
          format_ms_delta() {
            local delta=$1
            if [ "$delta" -gt 0 ]; then
              echo " +${delta}ms |"
            elif [ "$delta" -lt 0 ]; then
              echo " ${delta}ms |"
            else
              echo " no change |"
            fi
          }

          # Fetch baselines from badges branch for delta reporting
          BASELINE_CORE=""
          BASELINE_MCP=""
          BASELINE_STARTUP=""
          if git fetch origin badges 2>/dev/null; then
            BASELINE_JSON=$(git show origin/badges:.github/badges/bundle-sizes.json 2>/dev/null || echo "")
            if [ -n "$BASELINE_JSON" ]; then
              BASELINE_CORE=$(echo "$BASELINE_JSON" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).core}catch{''}" 2>/dev/null || echo "")
              BASELINE_MCP=$(echo "$BASELINE_JSON" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).mcp}catch{''}" 2>/dev/null || echo "")
              if [ -z "$BASELINE_CORE" ] || [ -z "$BASELINE_MCP" ]; then
                echo "::warning::bundle-sizes.json on badges branch could not be parsed. Delta reporting disabled."
              fi
            else
              echo "::notice::No bundle-sizes.json on badges branch yet. Delta reporting will be available after the next main merge."
            fi
            STARTUP_JSON=$(git show origin/badges:.github/badges/startup-time.json 2>/dev/null || echo "")
            if [ -n "$STARTUP_JSON" ]; then
              BASELINE_STARTUP=$(echo "$STARTUP_JSON" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).startupMs}catch{''}" 2>/dev/null || echo "")
              if [ -z "$BASELINE_STARTUP" ]; then
                echo "::warning::startup-time.json on badges branch could not be parsed. Startup delta reporting disabled."
              fi
            else
              echo "::notice::No startup-time.json on badges branch yet. Startup delta reporting will be available after the next main merge."
            fi
          fi

          # Require both bundle baselines to be numeric; treat as atomic pair
          HAS_BASELINE=""
          if [ -n "$BASELINE_CORE" ] && [ -n "$BASELINE_MCP" ] \
             && [[ "$BASELINE_CORE" =~ ^[0-9]+$ ]] && [[ "$BASELINE_MCP" =~ ^[0-9]+$ ]]; then
            HAS_BASELINE=1
          fi

          HAS_STARTUP_BASELINE=""
          if [ -n "$BASELINE_STARTUP" ] && [[ "$BASELINE_STARTUP" =~ ^[0-9]+$ ]]; then
            HAS_STARTUP_BASELINE=1
          fi

          # Show delta column if either baseline type is available
          SHOW_DELTA=""
          if [ -n "$HAS_BASELINE" ] || [ -n "$HAS_STARTUP_BASELINE" ]; then
            SHOW_DELTA=1
          fi

          # Build report table (reused for step summary and PR comment)
          HEADER="| Metric | Value | Threshold |"
          SEPARATOR="|--------|-------|-----------|"
          if [ -n "$SHOW_DELTA" ]; then
            HEADER+=" Delta vs main |"
            SEPARATOR+="----------------|"
          fi

          CORE_ROW="| Core CLI | ${core_kb} KB | ${core_max_kb} KB |"
          MCP_ROW="| MCP Server | ${mcp_kb} KB | ${mcp_max_kb} KB |"
          if [ -n "$SHOW_DELTA" ]; then
            if [ -n "$HAS_BASELINE" ]; then
              CORE_ROW+="$(format_delta $((CORE_SIZE - BASELINE_CORE)))"
              MCP_ROW+="$(format_delta $((MCP_SIZE - BASELINE_MCP)))"
            else
              CORE_ROW+=" — |"
              MCP_ROW+=" — |"
            fi
          fi

          STARTUP_ROW=""
          if [ -n "$STARTUP_MS" ]; then
            STARTUP_ROW="| Startup (--help) | ${STARTUP_MS}ms | ${STARTUP_WARN_MS}ms |"
            if [ -n "$SHOW_DELTA" ]; then
              if [ -n "$HAS_STARTUP_BASELINE" ]; then
                STARTUP_ROW+="$(format_ms_delta $((STARTUP_MS - BASELINE_STARTUP)))"
              else
                STARTUP_ROW+=" — |"
              fi
            fi
          else
            echo "::warning::Startup benchmark did not produce a result. Startup metric omitted from report."
          fi

          TABLE="${HEADER}\n${SEPARATOR}\n${CORE_ROW}\n${MCP_ROW}"
          if [ -n "$STARTUP_ROW" ]; then
            TABLE+="\n${STARTUP_ROW}"
          fi

          # Step summary
          {
            echo "### Build Metrics"
            echo ""
            echo -e "$TABLE"
          } >> "$GITHUB_STEP_SUMMARY"

          # Determine threshold pass/fail before optional steps (PR comment posting may fail)
          FAILED=0
          if [ "$CORE_SIZE" -gt "$BUNDLE_MAX_CORE" ]; then
            echo "::error::Core CLI bundle (${core_kb} KB) exceeds threshold (${core_max_kb} KB)"
            FAILED=1
          fi
          if [ "$MCP_SIZE" -gt "$BUNDLE_MAX_MCP" ]; then
            echo "::error::MCP Server bundle (${mcp_kb} KB) exceeds threshold (${mcp_max_kb} KB)"
            FAILED=1
          fi

          # Startup time warning (not a hard fail — CI runner performance varies)
          if [ -n "$STARTUP_MS" ] && [ "$STARTUP_MS" -gt "$STARTUP_WARN_MS" ]; then
            echo "::warning::CLI startup time (${STARTUP_MS}ms) exceeds warning threshold (${STARTUP_WARN_MS}ms)"
          fi

          # Post PR comment (non-fatal — must not prevent threshold enforcement)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            COMMENT="## Build Metrics Report\n\n${TABLE}"
            echo -e "$COMMENT" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - --edit-last 2>/dev/null \
              || echo -e "$COMMENT" | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - \
              || echo "::warning::Failed to post build metrics comment to PR"
          fi

          # Exit after comment attempt so the PR still gets its report
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Bundle size threshold exceeded. If this increase is justified, update BUNDLE_MAX_* env vars in ci.yml via PR."
            exit 1
          fi
          echo "All build metrics within thresholds"

  # Maintains badges and baselines on the 'badges' branch after CI passes on main.
  # Uses a separate branch because main has branch protection rules.
  # - Test count badge (tests.json) for shields.io endpoint
  # - Bundle size baseline (bundle-sizes.json) for PR delta reporting
  # - Startup time baseline (startup-time.json) for PR startup delta reporting
  update-badge:
    name: Update badges
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and update badge
        run: |
          pnpm --filter @oss-autopilot/core exec vitest run --reporter=json --outputFile=test-results.json || true
          if [ ! -f packages/core/test-results.json ]; then
            echo "::warning::vitest did not produce test-results.json. Badge not updated."
            exit 0
          fi
          PASSED=$(node -p "try { require('./packages/core/test-results.json').numPassedTests || 0 } catch { 0 }")
          if [ "$PASSED" -gt 0 ]; then
            mkdir -p .github/badges
            echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passing\",\"color\":\"success\"}" > .github/badges/tests.json
            echo "Badge updated: ${PASSED} passing"
          else
            echo "::warning::vitest ran but 0 tests passed. Badge not updated."
          fi
          rm -f packages/core/test-results.json

      - name: Build core types
        run: pnpm --filter @oss-autopilot/core run build

      - name: Record bundle sizes
        run: |
          pnpm run bundle
          for bundle in packages/core/dist/cli.bundle.cjs packages/mcp-server/dist/mcp-server.bundle.cjs; do
            if [ ! -f "$bundle" ]; then
              echo "::error::$bundle was not produced by the bundle step"
              exit 1
            fi
          done
          CORE_SIZE=$(wc -c < packages/core/dist/cli.bundle.cjs | tr -d ' ')
          MCP_SIZE=$(wc -c < packages/mcp-server/dist/mcp-server.bundle.cjs | tr -d ' ')
          mkdir -p .github/badges
          node -e "console.log(JSON.stringify({core:$CORE_SIZE,mcp:$MCP_SIZE,timestamp:new Date().toISOString()}))" > .github/badges/bundle-sizes.json
          echo "Recorded bundle sizes: core=${CORE_SIZE}, mcp=${MCP_SIZE}"

      - name: Record startup time
        run: |
          BENCH_STDERR=$(mktemp)
          STARTUP_MS=$(node .github/scripts/benchmark-startup.cjs 2>"$BENCH_STDERR") || true
          if ! [[ "$STARTUP_MS" =~ ^[0-9]+$ ]]; then
            echo "::warning::Benchmark produced non-numeric startup time: '$STARTUP_MS'. Startup baseline not updated."
            cat "$BENCH_STDERR"
            rm -f "$BENCH_STDERR"
            exit 0
          fi
          rm -f "$BENCH_STDERR"
          mkdir -p .github/badges
          STARTUP_MS="$STARTUP_MS" node -e "console.log(JSON.stringify({startupMs:Number(process.env.STARTUP_MS),timestamp:new Date().toISOString()}))" > .github/badges/startup-time.json
          echo "Recorded startup time: ${STARTUP_MS}ms"

      - name: Push badges to badges branch
        run: |
          if [ ! -d .github/badges ] || [ -z "$(ls .github/badges/ 2>/dev/null)" ]; then
            echo "No badge files to push"
            exit 0
          fi
          cp -r .github/badges /tmp/badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Disable git hooks before checkout — the badges branch has no package.json,
          # so pnpm post-checkout hooks fail with ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND.
          rm -rf .git/hooks
          # Fetch existing badges branch, or create orphan on first run
          if git fetch origin badges:badges 2>/dev/null; then
            git checkout -f badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p .github/badges
          cp -r /tmp/badges/* .github/badges/
          git add .github/badges/
          # Only commit and push if content changed
          if git diff --staged --quiet; then
            echo "Badges unchanged, skipping push"
          else
            git commit -m "chore: update badges [skip ci]"
            git push origin badges --force
          fi
