name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      core-released: ${{ steps.release.outputs.release_created }}
      core-tag: ${{ steps.release.outputs.tag_name }}
      mcp-released: ${{ steps.release.outputs['packages/mcp-server--release_created'] }}
      mcp-tag: ${{ steps.release.outputs['packages/mcp-server--tag_name'] }}
    steps:
      # Uses a PAT so that the push to the release branch triggers CI.
      # GITHUB_TOKEN events don't trigger other workflows (prevents loops),
      # but PAT events do.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}

      # .mcp.json pins the MCP server the plugin launches to the released
      # @oss-autopilot/mcp version. release-please cannot maintain that pin:
      # its json updater would replace the whole "@oss-autopilot/mcp@x.y.z"
      # string with the bare version, and JSON cannot carry
      # x-release-please-version markers. So re-pin on the release PR branch
      # here. release-please force-pushes that branch whenever the release
      # notes change, which drops this commit; prs_created is true on exactly
      # those runs, so the step adds it back. CI's MCP metadata guard fails
      # the release PR if the pin and packages/mcp-server/package.json still
      # disagree. The config uses one combined release PR, hence prs[0].
      - name: Find the release PR branch
        id: release-pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          BRANCH=$(node -e 'const prs = JSON.parse(process.env.PRS || "[]"); process.stdout.write(prs[0]?.headBranchName ?? "")')
          if [ -n "$BRANCH" ] && ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected release PR branch name: $BRANCH"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out the release PR branch
        if: steps.release-pr.outputs.branch != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Pin .mcp.json to the release's MCP server version
        if: steps.release-pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          node scripts/sync-mcp-pin.mjs
          if git diff --quiet -- .mcp.json; then
            echo ".mcp.json already matches packages/mcp-server/package.json"
            exit 0
          fi
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .mcp.json
          git commit -m "chore: pin .mcp.json to @oss-autopilot/mcp@${VERSION}"
          git push origin "HEAD:${BRANCH}"

  publish-npm:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.core-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.core-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC): the job's id-token mints the credential,
      # so no long-lived NPM_TOKEN is needed. The 3.22.0 publish failed with
      # `404 Not Found - PUT` on a fresh granular token after npm restricted
      # 2FA-bypassing tokens; the trusted publisher for both packages is
      # registered on npmjs.com (owner costajohnt, repo oss-autopilot, this
      # workflow file). Needs npm >= 11.5.1, newer than Node 22's bundled npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Build and pack @oss-autopilot/core
        run: |
          pnpm --filter @oss-autopilot/core run prepublishOnly
          pnpm --filter @oss-autopilot/core pack --pack-destination "$RUNNER_TEMP/pkg-core"

      # `dashboard serve` from npm needs the SPA inside this tarball: the
      # dashboard package is private. Fail here rather than ship without it.
      - name: Verify the tarball carries the dashboard assets
        # No `grep -q`: it exits at the first match, tar dies of SIGPIPE, and
        # the step's `pipefail` shell would fail a good tarball.
        run: tar -tzf "$RUNNER_TEMP"/pkg-core/*.tgz | grep -x 'package/dist/dashboard/index.html'

      - name: Publish @oss-autopilot/core
        run: npm publish "$RUNNER_TEMP"/pkg-core/*.tgz --access public --provenance

  publish-mcp-npm:
    name: Publish MCP server to npm
    needs: [release-please, publish-npm]
    if: >-
      always()
      && !failure()
      && !cancelled()
      && needs.release-please.outputs.mcp-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.mcp-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (required by mcp-server)
        run: pnpm --filter @oss-autopilot/core run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # `pnpm pack` rewrites the `workspace:^` dependency on core to the
      # released version; `npm publish <tarball>` then needs no pnpm at all.
      - name: Build and pack @oss-autopilot/mcp
        run: |
          pnpm --filter @oss-autopilot/mcp run prepublishOnly
          pnpm --filter @oss-autopilot/mcp pack --pack-destination "$RUNNER_TEMP/pkg-mcp"

      - name: Publish @oss-autopilot/mcp
        run: npm publish "$RUNNER_TEMP"/pkg-mcp/*.tgz --access public --provenance

  # The official MCP Registry (registry.modelcontextprotocol.io) only updates
  # when we push server.json to it; it sat at 2.0.1 while npm moved to 5.x.
  # release-please bumps server.json's versions, so publish it from the tag
  # after the npm package exists (the registry checks the package's mcpName).
  # Auth is GitHub OIDC, scoped to the io.github.costajohnt/* namespace.
  publish-mcp-registry:
    name: Publish MCP server to the MCP Registry
    needs: [release-please, publish-mcp-npm]
    if: >-
      always()
      && needs.publish-mcp-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.mcp-tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pinned release, Sigstore-verified, per the registry's GitHub Actions guide.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # The registry validates the version against npm, which can take
      # minutes to serve a fresh publish (mcp-v5.11.0 was still a 404 to the
      # registry 90s after publishing). Wait for npm, then retry the publish
      # a few times in case the registry's own lookup lags behind ours.
      - name: Wait for npm to serve the release
        run: |
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          for _ in $(seq 1 20); do
            npm view "@oss-autopilot/mcp@${VERSION}" version >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::@oss-autopilot/mcp@${VERSION} not on npm after 10 minutes"
          exit 1

      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish packages/mcp-server/server.json && exit 0
            echo "publish attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

  # The Claude plugin directory submission tracks the `directory` branch, a
  # plugin-only tree (no pnpm workspace config, which the directory's
  # validator blocks). Append one commit per core or MCP release (an MCP-only
  # release still re-pins .mcp.json); never force-push.
  publish-directory-branch:
    name: Update the plugin directory branch
    needs: [release-please, publish-npm, publish-mcp-npm]
    if: >-
      always()
      && !failure()
      && !cancelled()
      && (needs.publish-npm.result == 'success' || needs.publish-mcp-npm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release merge commit carries both packages' bumped versions.
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the released core version
        id: core
        run: echo "version=$(node -p "require('./.release-please-manifest.json')['.']")" >> "$GITHUB_OUTPUT"

      - name: Assemble the plugin tree
        env:
          VERSION: ${{ steps.core.outputs.version }}
        run: scripts/build-directory-branch.sh "$VERSION" "$RUNNER_TEMP/directory"

      - name: Commit and push to the directory branch
        env:
          TAG: core-v${{ steps.core.outputs.version }} / ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          WT="$RUNNER_TEMP/directory-wt"
          if git fetch --depth=1 origin directory; then
            git worktree add --detach "$WT" FETCH_HEAD
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan directory-init
          fi
          git -C "$WT" rm -rqf --ignore-unmatch .
          cp -R "$RUNNER_TEMP/directory/." "$WT/"
          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "directory branch already matches ${TAG}"
            exit 0
          fi
          git -C "$WT" commit -q -m "chore: plugin directory build for ${TAG}"
          git -C "$WT" push origin HEAD:refs/heads/directory
