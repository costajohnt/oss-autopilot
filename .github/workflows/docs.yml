name: Deploy API Docs

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/src/**'
      - 'packages/core/typedoc.json'
      - 'packages/core/tsconfig.json'
      - 'packages/core/package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core types
        run: pnpm --filter @oss-autopilot/core run build

      - name: Generate API docs
        run: pnpm run docs

      - name: Verify docs output
        run: |
          if [ ! -f packages/core/docs/api/index.html ]; then
            echo "::error::TypeDoc did not generate expected output at packages/core/docs/api/index.html"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/core/docs/api

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
